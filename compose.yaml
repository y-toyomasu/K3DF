version: "3.8"

services:
  web:
    build:
      context: ./web
    container_name: k3df-web
    env_file:
      - .env
    develop:
      watch:
        - action: sync
          path: ./web/app.py
          target: /app/app.py
    expose:
      - "8080"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  nginx:
    image: arm32v7/nginx:alpine
    container_name: k3df-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - web
    restart: unless-stopped

