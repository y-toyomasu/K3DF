services:
  web:
    build:
      context: ./web
    container_name: k3df-web
    env_file:
      - .env
    expose:
      - "8080"
    volumes:
      - ./data:/app/data
      - ./web/app.py:/app/app.py:ro
    restart: unless-stopped

  nginx:
    image: arm32v7/nginx:alpine
    container_name: k3df-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - web
      - defender
      - referee
    restart: unless-stopped

  referee:
    build:
      context: ./referee
    container_name: k3df-referee
    environment:
      K3DF_CTF_DEMO_SEED: ${K3DF_CTF_DEMO_SEED:-ValidationSeed}
      K3DF_REFEREE_MAX_SUBMISSIONS: ${K3DF_REFEREE_MAX_SUBMISSIONS:-30}
    volumes:
      - ./runtime/ctf/flag-1/flag-1.value:/run/referee-flags/flag-1.value:ro
      - ./runtime/ctf/flag-2/flag-2.value:/run/referee-flags/flag-2.value:ro
      - ./runtime/ctf/flag-3/flag-3.value:/run/referee-flags/flag-3.value:ro
      - ./state/referee:/state
    expose:
      - "8091"
    restart: unless-stopped

  defender:
    build:
      context: ./defender
    container_name: k3df-defender
    env_file:
      - .env
    environment:
      K3DF_REASONING_INTERVAL_SEC: ${K3DF_REASONING_INTERVAL_SEC:-10}
      K3DF_REASONING_EFFORT: ${K3DF_REASONING_EFFORT:-low}
      K3DF_IGNORE_NETWORKS: ${K3DF_IGNORE_NETWORKS:-10.8.8.0/24}
      K3DF_ACCESS_LOG_PATH: /var/log/nginx/access.log
      K3DF_SCANNER_RESULT_PATH: /state/scanner/latest.json
    expose:
      - "8090"
    volumes:
      - ./logs/nginx:/var/log/nginx:ro
      - ./state:/state
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
    container_name: k3df-dashboard
    environment:
      TARGET_HEALTH_URL: http://web:8080/health
      ACCESS_LOG_PATH: /var/log/nginx/access.log
      DEFENDER_STATE_PATH: /state/defender_state.json
      DEFENDER_EVENTS_PATH: /state/events.ndjson
    ports:
      - "8888:8888"
    volumes:
      - ./logs/nginx:/var/log/nginx:ro
      - ./state:/state:ro
    depends_on:
      - web
      - nginx
    restart: unless-stopped

