services:
  web:
    build:
      context: ./web
    container_name: k3df-web
    env_file:
      - .env
    expose:
      - "8080"
    volumes:
      - ./data:/app/data
      - ./web/app.py:/app/app.py:ro
    restart: unless-stopped

  nginx:
    image: arm32v7/nginx:alpine
    container_name: k3df-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - web
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
    container_name: k3df-dashboard
    environment:
      TARGET_HEALTH_URL: http://web:8080/health
      ACCESS_LOG_PATH: /var/log/nginx/access.log
    ports:
      - "8888:8888"
    volumes:
      - ./logs/nginx:/var/log/nginx:ro
    depends_on:
      - web
      - nginx
    restart: unless-stopped

