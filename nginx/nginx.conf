events {}

http {
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    upstream web {
        server web:8080;
    }

    server {
        listen 80;

        location = /_defender_auth {
            internal;
            proxy_pass http://defender:8090/nginx/auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-Remote-Addr $remote_addr;
        }

        location / {
            auth_request /_defender_auth;
            proxy_pass http://web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location ~ ^/ctf/referee/v1/runs/[A-Za-z0-9_-]{1,96}/(submissions|status)$ {
            proxy_pass http://referee:8091;
            proxy_set_header Host $host;
            proxy_redirect off;
        }

        location = /ctf/referee/health {
            proxy_pass http://referee:8091/health;
            proxy_redirect off;
        }
    }
}
